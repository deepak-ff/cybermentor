name: Baseline Scheduled Scan

on:
  schedule:
    - cron: '0 2 * * 0' # weekly at 02:00 UTC on Sundays
  workflow_dispatch:

jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run audit to generate report
        run: |
          mkdir -p reports
          # Target controlled by secret SCAN_TARGET or default localhost
          python -m audit_tool --host "${{ secrets.SCAN_TARGET }}" --ports 1-1024 --threads 64 --out reports || true
      - name: Find latest report
        id: find
        run: |
          latest=$(ls -1tr reports/*.json | tail -n1 || true)
          echo "::set-output name=latest::$latest"
      - name: Compare with baseline
        run: |
          if [ -z "${{ steps.find.outputs.latest }}" ]; then echo "No report generated" && exit 1; fi
          python -m audit_tool.baseline baseline/baseline.json "${{ steps.find.outputs.latest }}" || echo "Regression detected"
      - name: Create issue on regression
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Baseline regression detected"
          content-file: README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
