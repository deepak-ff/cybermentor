name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.8 is EOL; current mypy/black require >= 3.9/3.10 to run.
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff black mypy coverage codecov jsonschema
      - name: Run linters, mypy and tests
        run: |
          ruff check .
          black --check .
          mypy .
          coverage run -m pytest -q
          coverage xml || true
          # upload to codecov (optional)
          python -m codecov || true
